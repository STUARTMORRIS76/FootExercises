<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Foot Exercise Progression</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #e1f5fe, #fce4ec);
    color: #333;
  }

  header {
    text-align: center;
    padding: 20px;
    background: #0288d1;
    color: white;
    font-size: 1.8rem;
    font-weight: bold;
  }

  /* Slider Switch */
  .toggle-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #fff;
  }

  .switch-label {
    font-size: 1rem;
    font-weight: bold;
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 34px;
  }

  .slider:before {
    position: absolute;
    content: "";
    height: 22px;
    width: 22px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
  }

  input:checked + .slider {
    background-color: #0288d1;
  }

  input:checked + .slider:before {
    transform: translateX(24px);
  }

  /* Gallery */
  .gallery {
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
  }

  .tile {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    padding: 12px;
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
  }

  .tile h3 {
    margin: 8px 0 4px;
    color: #d32f2f;
    font-size: 1.1rem;
  }

  iframe, .thumb {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 8px;
  }

  .thumb {
    height: 90px;
    object-fit: cover;
    cursor: pointer;
  }

  /* Collapsible */
  .collapse-btn {
    background: #ffca28;
    border: none;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    margin-bottom: 6px;
    text-align: left;
    width: 100%;
  }

  .collapse-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    font-size: 0.9rem;
  }

  /* Desktop */
  @media (min-width: 701px) {
    .thumbnail-container { display: none; }
    .iframe-container { display: block; }
    .iframe-container iframe { height: 220px; }
  }

  /* Mobile: grid/list modes */
  @media (max-width: 700px) {
    .gallery.grid-mode {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .gallery.list-mode {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .gallery.grid-mode .thumbnail-container { display: block; }
    .gallery.grid-mode .iframe-container { display: none; }
    .gallery.list-mode .thumbnail-container { display: none; }
    .gallery.list-mode .iframe-container { display: block; }
    .gallery.list-mode .iframe-container iframe {
      height: 320px;
    }
  }

  /* Counter section */
  .counter-section {
    text-align: center;
    padding: 20px;
    background: #fff3cd;
    margin-top: 20px;
  }

  #countBtn {
    background: #43a047;
    color: white;
    padding: 20px 30px;
    border: none;
    border-radius: 14px;
    font-size: 1.4rem;
    cursor: pointer;
    width: 85%;
    max-width: 360px;
    margin-top: 10px;
  }

  #countBtn:active { background: #2e7d32; }
</style>
</head>

<body>
<header>Foot Exercise Progression</header>

<!-- Slider Switch -->
<div class="toggle-bar">
  <span class="switch-label">Full Screen</span>
  <label class="switch">
    <input type="checkbox" id="layoutToggle">
    <span class="slider round"></span>
  </label>
</div>

<!-- Gallery -->
<div class="gallery grid-mode" id="gallery"></div>

<!-- Counter -->
<div class="counter-section">
  <h2>Routine Tracker</h2>
  <p><strong>Times completed in last 7 days:</strong> <span id="weekCount">0</span></p>
  <p><strong>Last workout:</strong> <span id="lastWorkout">None</span></p>
  <button id="countBtn">I Did Today’s Routine</button>
</div>

<!-- JSON ARRAY -->
<script>
const exercises = [
  {
    "title": "Toe Walks",
    "description": "Walk forward and backwards staying on your toes.\nImproves foot strength and balance.",
    "url": "https://youtube.com/shorts/1BgOsN_y4qc?si=kkdrfMzUwHSR_b3d",
    "reps": "2–3 rounds × 20–30 seconds"
  },
  {
    "title": "Assisted Squat Rockers",
    "description": "Hold onto support. Drop into squat and gently rock your weight forward towards toes, then back.",
    "url": "https://www.youtube.com/watch?v=S5xi3PMWosc",
    "reps": "2–3 sets × 8–10"
  },
  {
    "title": "Single Leg RDL (Band hold with toe)",
    "description": "Stand on one leg and hinge forward slightly.\nUse a light band under the big toe.",
    "url": "https://youtube.com/shorts/utPI7wLWcCs?si=o33fUIXyKR-SaT0Z",
    "reps": "2–3 sets × 6–8 each side"
  },
  {
    "title": "Heel Float Split Squat Hold",
    "description": "In a split squat position, slightly lift the heel of your front foot and hold.",
    "url": "https://youtube.com/shorts/tEKvskuGDcI?si=DcUrb1ME-WiVJ_5Q"
    "reps": "2–3 sets × 15–25 seconds each side"
  }
];
</script>

<script>
const gallery = document.getElementById("gallery");

/* Build tiles dynamically */
exercises.forEach(ex => {
  const tile = document.createElement("div");
  tile.className = "tile";

  const videoId =
    ex.url.includes("v=")
      ? ex.url.split("v=")[1].split("&")[0]
      : ex.url.split("/shorts/")[1].split("?")[0];

  tile.innerHTML = `
    <div class="thumbnail-container">
      <img class="thumb" src="https://img.youtube.com/vi/${videoId}/0.jpg" data-video="${videoId}">
    </div>

    <div class="iframe-container">
      <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
    </div>

    <h3>${ex.title}</h3>

    <button class="collapse-btn">+ Details</button>
    <div class="collapse-content">
      <p>${ex.description.replace(/\n/g, "<br>")}</p>
      <p><strong>${ex.reps}</strong></p>
    </div>
  `;

  gallery.appendChild(tile);
});

/* Tap thumbnail to play */
document.addEventListener("click", e => {
  if (e.target.classList.contains("thumb")) {
    const id = e.target.dataset.video;
    e.target.outerHTML =
      `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen></iframe>`;
  }
});

/* Slider switch: 2x2 grid <-> full screen column */
document.getElementById("layoutToggle").addEventListener("change", e => {
  if (window.innerWidth <= 700) {
    gallery.classList.toggle("grid-mode", !e.target.checked);
    gallery.classList.toggle("list-mode", e.target.checked);
  }
});

/* Collapsible descriptions */
document.addEventListener("click", e => {
  if (e.target.classList.contains("collapse-btn")) {
    const content = e.target.nextElementSibling;
    if (content.style.maxHeight) {
      content.style.maxHeight = null;
      e.target.textContent = "+ Details";
    } else {
      content.style.maxHeight = content.scrollHeight + "px";
      e.target.textContent = "− Hide";
    }
  }
});

/* Workout counter */
const weekCountEl = document.getElementById("weekCount");
const lastWorkoutEl = document.getElementById("lastWorkout");
const countBtn = document.getElementById("countBtn");

function loadData() {
  const data = JSON.parse(localStorage.getItem("workoutLog") || "[]");
  const sevenDaysAgo = new Date();
  sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 6);

  const count = data.filter(d => new Date(d) >= sevenDaysAgo).length;
  weekCountEl.textContent = count;
  lastWorkoutEl.textContent = data.length ? data[data.length - 1] : "None";
}

countBtn.addEventListener("click", () => {
  const today = new Date().toISOString().slice(0,10);
  let data = JSON.parse(localStorage.getItem("workoutLog") || "[]");

  if (data.includes(today)) {
    alert("You've already logged today's workout.");
    return;
  }

  data.push(today);
  localStorage.setItem("workoutLog", JSON.stringify(data));
  loadData();
});

loadData();
</script>

</body>
</html>
